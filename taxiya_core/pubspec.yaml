name: taxiya_core
description: "Paquete compartido de TaxiYa (modelos, tema, caché Hive, utilidades PostGIS y conexión a Supabase esquema taxiya)."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  flutter_riverpod: ^3.5.0
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/avatars/
